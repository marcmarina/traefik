# API and Dashboard
api:
  dashboard: true
  insecure: false

log:
  level: WARN

# Entry Points
entryPoints:
  web:
    address: ":80"

# Docker Provider
providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: true
    network: traefik

# Certificate Resolvers
accessLog: {}
